apiVersion: v1
kind: ConfigMap
metadata:
  name: ignition-payload-server-proxy-config
data:
  haproxy.conf: |
    defaults
      mode http
      timeout connect 5s
      timeout client 30s
      timeout server 30s

    frontend ignition-payload-server
      bind :::8443 v4v6 ssl crt /tmp/tls.pem alpn http/1.1
      default_backend ignition_payload_servers

    backend ignition_payload_servers
      server ignition-payload-server ignition-payload-server:443 check ssl ca-file /etc/ssl/ca/ca.crt alpn http/1.1
