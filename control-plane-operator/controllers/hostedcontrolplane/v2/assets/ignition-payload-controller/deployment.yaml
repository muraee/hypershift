apiVersion: apps/v1
kind: Deployment
metadata:
  name: ignition-payload-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ignition-payload-controller
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ignition-payload-controller
    spec:
      containers:
      - command:
        - /usr/bin/hypershift-operator
        args:
        - ignition-payload-controller
        - --feature-gate-manifest=/shared/99_feature-gate.yaml
        env:
        - name: MY_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: OPENSHIFT_IMG_OVERRIDES
          value: =
        image: hypershift-operator
        name: ignition-payload-controller
        resources:
          requests:
            cpu: 10m
            memory: 40Mi
        volumeMounts:
        - mountPath: /payloads
          name: payloads
        - mountPath: /usr/share/bootkube/manifests/bootstrap-manifests
          name: bootstrap-manifests
        - mountPath: /usr/share/bootkube/manifests/manifests
          name: manifests
        - mountPath: /shared
          name: shared
        - mountPath: /etc/pki/ca-trust/extracted/pem
          name: openshift-config-managed-trusted-ca-bundle
          readOnly: true
      initContainers:
      - args:
        - -c
        - |
          #!/bin/bash
          set -e
          cd /tmp
          mkdir input output manifests

          touch /tmp/manifests/99_feature-gate.yaml
          cat <<EOF >/tmp/manifests/99_feature-gate.yaml
          $(FEATURE_GATE_YAML)

          EOF

          cp /tmp/manifests/99_feature-gate.yaml /shared/99_feature-gate.yaml
        command:
        - /bin/bash
        env:
        - name: FEATURE_GATE_YAML
          value: |
            apiVersion: config.openshift.io/v1
            kind: FeatureGate
            metadata:
              creationTimestamp: null
              name: cluster
            spec: {}
            status:
              featureGates: null
        image: cluster-config-api
        name: fetch-feature-gate
        resources:
          requests:
            cpu: 10m
            memory: 40Mi
        volumeMounts:
        - mountPath: /shared
          name: shared
      serviceAccountName: ignition-payload-controller
      terminationGracePeriodSeconds: 10
      volumes:
      - emptyDir: {}
        name: payloads
      - emptyDir: {}
        name: bootstrap-manifests
      - emptyDir: {}
        name: manifests
      - emptyDir: {}
        name: shared
      - configMap:
          defaultMode: 420
          items:
          - key: ca-bundle.crt
            path: tls-ca-bundle.pem
          name: openshift-config-managed-trusted-ca-bundle
          optional: true
        name: openshift-config-managed-trusted-ca-bundle
